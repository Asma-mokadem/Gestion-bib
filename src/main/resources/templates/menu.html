<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bibliothèque</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #f0ede8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: #faf9f7;
            border-radius: 24px;
            padding: 44px 40px 40px;
            border: 1px solid #e8e3dc;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: #d4c5b0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 22px;
            height: 22px;
            fill: #6b5a45;
        }

        .logo-text h1 {
            font-size: 17px;
            font-weight: 600;
            color: #2d2620;
            letter-spacing: -0.3px;
        }

        .logo-text p {
            font-size: 12px;
            color: #9a8a78;
            font-weight: 400;
            margin-top: 1px;
        }

        .divider {
            height: 1px;
            background: #e8e3dc;
            margin: 0 0 28px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 500;
            color: #b0a090;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 14px;
            text-decoration: none;
            color: #3d3028;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            border: 1px solid transparent;
            transition: background 0.18s, border-color 0.18s;
        }

        .nav-item:last-child { margin-bottom: 0; }

        .nav-item:hover {
            background: #ede8e0;
            border-color: #ddd5c8;
        }

        .nav-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .nav-icon svg { width: 17px; height: 17px; }

        .icon-auteur { background: #e8dff5; }
        .icon-auteur svg { fill: #7c5abf; }

        .icon-livre { background: #d8eef0; }
        .icon-livre svg { fill: #3d8f96; }

        .icon-affect { background: #fce8d8; }
        .icon-affect svg { fill: #c86833; }

        .nav-info { flex: 1; }
        .nav-title { font-size: 14px; font-weight: 500; color: #2d2620; }
        .nav-sub { font-size: 12px; color: #9a8a78; margin-top: 1px; font-weight: 400; }

        .nav-arrow {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #c0b4a4;
            stroke-width: 1.8;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: #b0a090;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">

        <div class="logo-area">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4V4zm0 4h10v2H4V8zm0 4h16v2H4v-2zm0 4h10v2H4v-2z"/></svg>
            </div>
            <div class="logo-text">
                <h1>Bibliothèque</h1>
                <p>Système de gestion — JavaEE 2025</p>
            </div>
        </div>

        <div class="divider"></div>

        <p class="section-label">Navigation</p>
        <!-- aller a section  auteurs-->
        <a th:href="@{/auteur}" href="/auteur" class="nav-item">
            <div class="nav-icon icon-auteur">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
            </div>
            <div class="nav-info">
                <div class="nav-title">Gérer les Auteurs</div>
                <div class="nav-sub">Ajouter, consulter les auteurs</div>
            </div>
            <svg class="nav-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
        <!-- aller a section des livres-->
        <a th:href="@{/livre}" href="/livre" class="nav-item">
            <div class="nav-icon icon-livre">
                <svg viewBox="0 0 24 24"><path d="M6 2h12a2 2 0 012 2v16a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm0 2v16h12V4H6zm2 3h8v2H8V7zm0 4h8v2H8v-2zm0 4h5v2H8v-2z"/></svg>
            </div>
            <div class="nav-info">
                <div class="nav-title">Gérer les Livres</div>
                <div class="nav-sub">Ajouter, consulter les livres</div>
            </div>
            <svg class="nav-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
        <!-- Taller a section affectation -->
        <a th:href="@{/livre/affecterAuteur}" href="/livre/affecterAuteur" class="nav-item">
            <div class="nav-icon icon-affect">
                <svg viewBox="0 0 24 24"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
            </div>
            <div class="nav-info">
                <div class="nav-title">Affecter les Auteurs</div>
                <div class="nav-sub">Lier un auteur à un livre</div>
            </div>
            <svg class="nav-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </a>

    </div>
    <div class="footer">Mme Ghada &nbsp;·&nbsp; TP2 JavaEE</div>
</div>
</body>
</html>
