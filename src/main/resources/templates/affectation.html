<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Affectation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f0ff;
            min-height: 100vh;
            padding: 30px;
        }

        .container { max-width: 750px; margin: auto; }

        h2 {
            color: #764ba2;
            font-size: 2em;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 3px solid #764ba2;
        }

        .form-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(118,75,162,0.15);
        }

        .form-card h3 {
            color: #764ba2;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 6px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0d0f0;
            border-radius: 8px;
            font-size: 1em;
            margin-bottom: 15px;
            background: white;
            transition: border 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #764ba2;
        }

        .btn-submit {
            background: linear-gradient(135deg, #764ba2, #667eea);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn-submit:hover { transform: translateY(-2px); }

        hr { border: none; border-top: 2px solid #e0d0f0; margin: 20px 0; }
        h3 { color: #764ba2; margin-bottom: 15px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(118,75,162,0.15);
        }

        thead {
            background: linear-gradient(135deg, #764ba2, #667eea);
            color: white;
        }

        th, td { padding: 14px 18px; text-align: left; }
        tbody tr:nth-child(even) { background: #f9f4ff; }
        tbody tr:hover { background: #ede9fe; }

        .points-badge {
            background: #764ba2;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #764ba2;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover { text-decoration: underline; }
    </style></head>
<body>
<h2>Affectation Auteur</h2>

<form th:action="@{/livre/affecterAuteur}" method="post">
    <label>Livre :</label><br/>
    <select name="isbn">
        <option value="">Sélectionner un livre</option>
        <option th:each="l : ${livres}"
                th:value="${l.isbn}"
                th:text="${l.titre}"></option>
    </select><br/><br/>

    <label>Auteur :</label><br/>
    <select name="auteurId">
        <option value="">Sélectionner un auteur</option>
        <option th:each="a : ${auteurs}"
                th:value="${a.id}"
                th:text="${a.nomPrenom}"></option>
    </select><br/><br/>

    <button type="submit">Ajouter</button>
</form>

<hr/>
<h3>Liste de tous les auteurs</h3>
<table border="1">
    <tr>
        <th>Id</th>
        <th>Nom Prénom</th>
        <th>Points</th>
    </tr>
    <tr th:each="a : ${auteurs}">
        <td th:text="${a.id}"></td>
        <td th:text="${a.nomPrenom}"></td>
        <td th:text="${a.nbrePoints}"></td>
    </tr>
</table>

<br/><a th:href="@{/}">← Retour au Menu</a>
</body>
</html>
